[project]
name = "tasko-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "pymongo>=4.13,<5", "redis>=5.2,<8",
  "pwdlib[argon2]>=0.2,<1", "email-validator>=2.2,<3"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "mongomock>=4.3,<5", "fakeredis[lua]>=2.27,<3", "ruff>=0.11,<1", "pyyaml>=6,<7"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
